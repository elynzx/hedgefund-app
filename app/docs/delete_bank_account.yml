tags:
  - Cuentas Bancarias
summary: Desactivar una cuenta bancaria
description: Oculta la cuenta del listado principal cambiando su estado a inactivo para preservar la integridad del historial de transacciones.
parameters:
  - in: path
    name: account_id
    required: true
    type: integer
    description: ID numerico de la cuenta bancaria a desactivar.
responses:
  200:
    description: Cuenta bancaria desactivada con exito.
  404:
    description: La cuenta bancaria no existe.
  401:
    description: No tienes permisos para modificar esta cuenta.